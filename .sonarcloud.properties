# SonarCloud automatic analysis configuration.
# TYPO3 `ext_tables.sql` files are MySQL/MariaDB schema definitions; SonarCloud guesses the
# SQL dialect and applies Oracle PL/SQL rules to them (e.g. "Use VARCHAR2 instead of VARCHAR"),
# which do not apply. Wildcard patterns are not supported in automatic analysis, so the files
# are listed explicitly.
# Binary fixtures (a JPEG and an impexp blob without a file extension) additionally trigger the
# scanner's "problems with file encoding" warning when indexed as text.
sonar.exclusions=Tests/Functional/Fixtures/Extensions/t3api_functional_test/ext_tables.sql,Tests/Postman/fixtures/,.ddev/test/
