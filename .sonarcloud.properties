# SonarCloud automatic analysis configuration.
# TYPO3 `ext_tables.sql` files are MySQL/MariaDB schema definitions; SonarCloud guesses the
# SQL dialect and applies Oracle PL/SQL rules to them (e.g. "Use VARCHAR2 instead of VARCHAR"),
# which do not apply. Wildcard patterns are not supported in automatic analysis, so the files
# are listed explicitly.
sonar.exclusions=Tests/Functional/Fixtures/Extensions/t3api_functional_test/ext_tables.sql

# Functional test fixtures are intentionally repetitive: TCA configuration files are TYPO3
# boilerplate (ctrl/enablecolumns/types) that is near-identical for every table by design, and
# fixture filters deliberately mirror each other's structure. Keep them out of copy-paste
# detection so the duplication quality gate measures production code only.
sonar.cpd.exclusions=Tests/Functional/Fixtures/
